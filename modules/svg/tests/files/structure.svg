<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <!-- Groups, transforms, inheritance, use, opacity, visibility, display. -->
  <defs>
    <path id="leaf" d="M0 -12 C 8 -6, 8 6, 0 12 C -8 6, -8 -6, 0 -12 Z"/>
  </defs>
  <g fill="#2a7" stroke="#063" stroke-width="1.5">
    <use href="#leaf" x="20" y="25"/>
    <use xlink:href="#leaf" transform="translate(50 25) rotate(45)"/>
    <use href="#leaf" transform="translate(80 25) scale(1.3 0.7)" fill="#c52"/>
  </g>
  <g transform="matrix(1 0 0.3 1 -10 0)" opacity="0.6">
    <rect x="15" y="50" width="30" height="20" fill="navy"/>
    <rect x="30" y="58" width="30" height="20" fill="crimson"/>
  </g>
  <g transform="rotate(-20 75 70)">
    <rect x="62" y="60" width="26" height="18" fill="none" stroke="black" stroke-width="2" stroke-dasharray="5 3" stroke-dashoffset="2"/>
  </g>
  <rect x="5" y="88" width="20" height="8" fill="red" visibility="hidden"/>
  <rect x="30" y="88" width="20" height="8" fill="red" display="none"/>
  <rect x="55" y="88" width="40" height="8" fill="currentColor" color="#a0a"/>
</svg>
