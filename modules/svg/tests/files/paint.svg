<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gradients in both unit systems, with href, transforms and spreads; clip paths. -->
  <defs>
    <linearGradient id="sunset">
      <stop offset="0" stop-color="#fc0"/>
      <stop offset="60%" stop-color="#e40" stop-opacity="0.9"/>
      <stop offset="1" style="stop-color: #519; stop-opacity: 1"/>
    </linearGradient>
    <linearGradient id="diagonal" href="#sunset" x1="0" y1="0" x2="1" y2="1"/>
    <linearGradient id="bands" href="#sunset" gradientUnits="userSpaceOnUse" x1="50" y1="0" x2="70" y2="0" spreadMethod="reflect"/>
    <radialGradient id="glow" cx="0.4" cy="0.4" r="0.6" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="#06c"/>
    </radialGradient>
    <radialGradient id="rings" gradientUnits="userSpaceOnUse" cx="75" cy="75" r="10" spreadMethod="repeat" gradientTransform="scale(1 1)">
      <stop offset="0" stop-color="#030"/>
      <stop offset="0.5" stop-color="#9f9"/>
      <stop offset="1" stop-color="#030"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="75" cy="75" r="20"/>
    </clipPath>
    <clipPath id="ring" clip-rule="evenodd">
      <path d="M5 75 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0 Z M15 75 a10 10 0 1 0 20 0 a10 10 0 1 0 -20 0 Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="42" height="42" fill="url(#diagonal)"/>
  <rect x="54" y="4" width="42" height="42" fill="url(#bands)" stroke="url(#sunset)" stroke-width="3"/>
  <circle cx="25" cy="75" r="23" fill="url(#glow)" clip-path="url(#ring)"/>
  <g clip-path="url(#disc)">
    <rect x="50" y="50" width="50" height="50" fill="url(#rings)"/>
  </g>
  <rect x="80" y="2" width="16" height="16" fill="url(#missing) green"/>
</svg>
